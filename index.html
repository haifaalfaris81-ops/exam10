<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>اختبار الوحدة الأولى: تحليل البيانات</title>
<style>
:root{--g:#047857;--bg:#f8fafc;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--ok:#dcfce7;--no:#fee2e2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Segoe UI',Tahoma,'Noto Sans Arabic',Arial,sans-serif;line-height:1.8}
.card{max-width:900px;margin:10px auto;background:#fff;border:1px solid var(--bd);border-radius:20px;padding:40px 45px;box-shadow:0 2px 10px #0000000d}
h1{color:var(--g);text-align:center;margin:0;font-size:2rem}
h2{text-align:center;margin:6px 0 0;font-size:1.4rem}
.sub{text-align:center;color:var(--mu);margin:4px 0 14px}
hr{border:0;border-top:3px solid var(--g);margin:10px 0 24px}
label{display:block;font-weight:700;margin:16px 0 8px}
input,select{width:100%;padding:14px 16px;font:inherit;border:2px solid var(--bd);border-radius:12px;background:#fff}
input:focus,select:focus{outline:0;border-color:var(--g)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 22px;font-weight:700}
.main{width:100%;background:var(--g);color:#fff;margin-top:24px;font-size:1.1rem}
.sec{background:#e5e7eb;color:var(--tx)}
.foot{text-align:center;border-top:1px solid var(--bd);margin-top:28px;padding-top:14px;font-weight:700}
.hide{display:none}
.q{border:1px solid var(--bd);border-radius:14px;padding:16px 20px;margin:14px 0}
.q b{display:block;margin-bottom:6px}
.op{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;cursor:pointer}
.op:hover{background:#f0fdf4}
.op input{width:auto;margin:0}
.bar{position:sticky;top:0;background:#fff;padding:8px 0;color:var(--mu);font-weight:700;z-index:2;border-bottom:1px solid var(--bd)}
.score{text-align:center;font-size:2.4rem;color:var(--g);font-weight:800;margin:0}
.msg{text-align:center;font-weight:700;margin:4px 0 16px}
.r{border-radius:14px;padding:14px 18px;margin:12px 0;border:1px solid var(--bd)}
.r.ok{background:var(--ok)}.r.no{background:var(--no)}
.r small{display:block;margin-top:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.row button{flex:1}
#st{text-align:center;color:var(--mu);font-weight:700}
bdi{unicode-bidi:isolate}
@media(max-width:600px){.card{padding:24px 18px;border-radius:0;margin:0}h1{font-size:1.5rem}}
@media print{.row,.bar{display:none}}
</style>
</head>
<body>
<div class="card">
  <h1>مدرسة سوم الثانوية الشاملة للبنات</h1>
  <h2>مادة المهارات الرقمية</h2>
  <p class="sub">الوحدة الأولى: تحليل البيانات (Data Analysis) – اختبار ذاتي التصحيح</p>
  <hr>

  <div id="s1">
    <label for="nm">اسم الطالبة:</label>
    <input id="nm" placeholder="أدخلي اسمكِ الثلاثي هنا...">
    <label for="ls">اختاري الدرس (20 سؤالًا عشوائيًا في كل اختبار):</label>
    <select id="ls"></select>
    <button class="main" onclick="start()">ابدأ الاختبار الآن</button>
  </div>

  <div id="s2" class="hide">
    <div class="bar" id="bar"></div>
    <div id="qs"></div>
    <button class="main" onclick="finish()">إنهاء الاختبار وتصحيحه</button>
  </div>

  <div id="s3" class="hide">
    <p class="score" id="sc"></p>
    <p class="msg" id="mg"></p>
    <p id="st"></p>
    <p id="sd" style="text-align:center;font-weight:700;color:var(--mu)"></p>
    <div class="row">
      <button class="main" style="margin:0" onclick="save()">حفظ النتيجة على سطح المكتب</button>
      <button class="sec" onclick="window.print()">طباعة</button>
      <button class="sec" onclick="location.reload()">اختبار جديد</button>
    </div>
    <div id="rv"></div>
  </div>

  <div class="foot">إعداد المعلمة: <span id="tc"></span></div>
</div>

<script>
const TEACHER='هيفاء الفارس';
/* الصقي هنا رابط Google Apps Script (ينتهي بـ /exec) لتفعيل الإرسال التلقائي إلى Google Sheets. اتركيه فارغًا لتعطيل الإرسال */
const SHEET_URL='https://script.google.com/macros/s/AKfycbzXon2UwxYBDN4JWCevsglpkzwpLve9iXQNfhnyc0zAY0YLXXFKlIwsUCOUSPeI9o2lnA/exec';
document.getElementById('tc').textContent=TEACHER;

/* ===== أدوات بناء الأسئلة ===== */
const m=(q,r,w,e)=>({q,o:[r,...w],a:0,e});            // اختيار من متعدد (الصحيحة أولًا ثم تُخلط)
const t=(q,b,e)=>({q,o:['صح','خطأ'],a:b?0:1,e,tf:1}); // صح / خطأ
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
function uniq(ans,cands){const s=new Set([ans]);for(const c of cands){if(s.size>=4)break;s.add(c)}let k=1;while(s.size<4)s.add(String(+ans+k++));return[...s].filter(x=>x!==ans)}
// أسئلة تتولّد بأرقام جديدة في كل مرة
const g1=()=>{const n=rnd(5,63),a=n.toString(2),f=i=>(n^(1<<i)).toString(2);
  return m(`العدد العشري (${n}) يكافئ بالنظام الثنائي:`,a,uniq(a,[f(0),f(1),f(2),(n+1).toString(2)]),`نقسم ${n} على 2 مرارًا ونرتب بواقي القسمة من الأخيرة إلى الأولى فنحصل على ${a}.`)};
const g2=()=>{const n=rnd(5,63),b=n.toString(2);
  return m(`العدد الثنائي (${b}) يكافئ بالنظام العشري:`,String(n),uniq(String(n),[n+1,n-1,n+2,n*2].map(String)),`نضرب كل رقم في قيمة منزلته (قوى العدد 2) ثم نجمع الناتج فيكون ${n}.`)};

/* ===== بنك الأسئلة ===== */
const L=[
{n:'الدرس الأول: البيانات والمعلومات',q:[
t('البيانات مجرد حقائق خام لا تحمل معنى محددًا دون سياق.',1,'صحيح؛ تصبح البيانات معلومات عند وضعها في سياق يعطيها معنى.'),
m('تنتج المعلومات عندما:','توضع البيانات في سياق يعطيها معنى',['تجمع البيانات الخام فقط','تخزن البيانات في الذاكرة','تحذف البيانات المكررة'],'المعلومات = البيانات + السياق (المعنى).'),
m('تساوي المعرفة:','المعلومات + التطبيق والاستخدام',['البيانات + السياق','البيانات + التخزين','المعلومات + الحذف'],'المعرفة = المعلومات + التطبيق والاستخدام والخبرة.'),
m('من أمثلة المعرفة الضمنية:','القدرة على قيادة السيارة',['عمان عاصمة الأردن','معلومة مكتوبة في موسوعة','جدول في كتاب مدرسي'],'المعرفة الضمنية صعبة الكتابة أو النقل لأنها قائمة على الخبرة.'),
t('الكلمات (قط، كلب، أرنب) بيانات، وتصبح معلومات عند وضعها في قائمة الحيوانات الأليفة.',1,'صحيح؛ السياق هو ما حوّل الكلمات إلى معلومات.'),
m('النظام الذي تمثل به الحواسيب البيانات داخلها هو النظام:','الثنائي',['العشري','الثماني','الهجائي'],'يستخدم النظام الثنائي الرقمين 0 و1 فقط.'),
m('أصغر وحدة لقياس البيانات في العالم الرقمي هي:','البت (Bit)',['البايت (Byte)','الكيلوبايت','البكسل'],'البت يحمل إحدى حالتين فقط: 0 أو 1.'),
t('يتكون البايت الواحد من 8 بتات.',1,'صحيح؛ 1 بايت = 8 بت.'),
m('يعادل الكيلوبايت (KB):','1024 بايت',['1000 بت','1024 ميجابايت','8 بايت'],'1 KB = 1024 بايت، و1 MB = 1024 KB.'),
t('النظام العشري أساسه العدد 2.',0,'خطأ؛ أساس النظام العشري 10، أما الثنائي فأساسه 2.'),
m('لتحويل عدد عشري إلى ثنائي نقسمه بشكل متكرر على:','2',['10','8','16'],'نقسم على 2 ونرتب بواقي القسمة من الأخيرة إلى الأولى.'),
m('عدد الرموز التي يمثلها نظام ASCII القياسي (7 بتات):','128 رمزًا',['256 رمزًا','64 رمزًا','65,536 رمزًا'],'2⁷ = 128 رمزًا.'),
t('نظام ASCII الممتد يستخدم 8 بتات ويستوعب 256 رمزًا.',1,'صحيح؛ 2⁸ = 256.'),
m('يتميز نظام Unicode عن ASCII بأنه:','يدعم لغات العالم المختلفة ومنها العربية',['يستخدم 7 بتات فقط','يمثل الأرقام فقط','لا يدعم الرموز'],'يخصص Unicode 16 بتًا أو أكثر لكل حرف فيدعم أكثر من 150 نظام كتابة.'),
t('يُمثَّل الحرف A في نظام ASCII بالعدد الثنائي 01000001 أي (65).',1,'صحيح؛ أما الحرف a فيمثل بالعدد 97.'),
m('أصغر وحدة في الصورة الرقمية هي:','البكسل (Pixel)',['البت','البايت','الإطار'],'تقسم الصورة إلى وحدات صغيرة تسمى بكسل ولكل بكسل لون.'),
m('عدد الألوان التي يمكن تمثيلها باستخدام 2 بت لكل بكسل:','4 ألوان',['2 لونان','8 ألوان','16 لونًا'],'2² = 4 ألوان: 00 و01 و10 و11.'),
t('إذا خُصص بت واحد لكل بكسل فالصورة تحتوي لونين فقط.',1,'صحيح؛ 0 يمثل الأسود و1 يمثل الأبيض.'),
t('عند تمثيل الصوت بعينات 16 بت تتراوح القيمة من 0 إلى 255.',0,'خطأ؛ هذا مدى 8 بت، أما 16 بت فمن 0 إلى 65,535.'),
t('يمثَّل العدد 9 بالنظام الثنائي بالرقم 1011.',0,'خطأ؛ 9 = 8 + 1 فتمثيله 1001.'),
m('أي الأعداد العشرية الآتية لا يمكن تمثيله بدقة بنظام ثنائي من 4 بت؟','16',['7','9','15'],'أكبر عدد يمثل بـ 4 بت هو 15 (1111).'),
g1,g2]},

{n:'الدرس الثاني: أنواع البيانات وطرائق تنظيمها',q:[
m('البيانات الكمية هي بيانات:','عددية يمكن قياسها وحسابها',['وصفية لا تقاس عدديًا','تصنف حسب الأسماء فقط','تتكون من صور فقط'],'الكمية تقاس عدديًا وتستخدم في العمليات الرياضية.'),
m('أي مما يأتي يعد بيانات نوعية؟','لون العينين',['درجة الحرارة','عدد الطلبة','وزن شخص'],'النوعية تصف صفات لا تقاس عدديًا.'),
m('من أمثلة البيانات الكمية المنفصلة:','عدد الطلبة في الصف',['طول الطالبة','درجة الحرارة','وزن الطالبة'],'المنفصلة قيم محددة (أعداد صحيحة) يمكن عدها.'),
m('أي مما يأتي بيانات كمية متصلة (مستمرة)؟','وزن شخص معين',['عدد الكتب في المكتبة','لون السيارة','ترتيب الطلبة في مسابقة'],'المتصلة تقع ضمن نطاق وقد تحتوي على كسور.'),
m('تصنف البيانات الاسمية في فئات:','دون ترتيب معين',['وفق ترتيب محدد','بمقياس كمي دقيق','بأرقام عشرية فقط'],'مثل أنواع الفاكهة وألوان العيون ومكان السكن.'),
m('ترتيب الطلبة في مسابقة (الأول، الثاني، الثالث) هو بيانات:','ترتيبية',['اسمية','كمية متصلة','غير منظمة'],'الترتيبية تصنف حسب الأولوية أو الرتبة.'),
t('جداول قواعد البيانات وملفات Excel أمثلة على البيانات المنظمة.',1,'صحيح؛ تنظم في صفوف وأعمدة مما يسهل البحث والتحليل.'),
m('من أمثلة البيانات غير المنظمة:','الصور ومقاطع الفيديو',['جداول قواعد البيانات','سجلات الحضور','السجلات المالية'],'لا تتبع نموذجًا أو تنسيقًا محددًا مسبقًا.'),
t('البيانات غير المنظمة تتبع نموذجًا أو تنسيقًا محددًا مسبقًا.',0,'خطأ؛ هذه صفة البيانات المنظمة.'),
m('تركز طرائق جمع البيانات النوعية على أسئلة مثل:','لماذا؟ وكيف؟',['كم؟ وكم عدد؟','نعم أم لا فقط','أي رقم أكبر؟'],'تستكشف الأسباب والتجارب والآراء بعمق.'),
m('من طرائق جمع البيانات النوعية:','المقابلات',['الاستبانات المغلقة','المراجعات الإحصائية','الاختبارات المعملية'],'النوعية: استبانات مفتوحة ومقابلات ومجموعات مركزة ودراسات حالة وملاحظة.'),
m('من طرائق جمع البيانات الكمية:','الاستبانات المغلقة',['المقابلات','المجموعات المركزة','دراسات الحالة'],'أسئلتها ذات إجابات محددة مسبقًا (نعم/لا، اختيارات متعددة).'),
t('المجموعات المركزة جلسات نقاشية مع مجموعة صغيرة (6–12 شخصًا).',1,'صحيح؛ حول موضوع محدد وفي وقت واحد.'),
m('المنهج المختلط في جمع البيانات:','يجمع بين المنهجين النوعي والكمي',['يعتمد على الأرقام فقط','يعتمد على المقابلات فقط','لا يستخدم أدوات'],'مثل استبانة مغلقة ثم مقابلات لفهم الأسباب.'),
m('عملية توزيع البيانات الخام في فئات أو مجموعات مشتركة الخصائص تسمى:','تصنيف البيانات',['تفريغ البيانات','حذف البيانات','تشفير البيانات'],'التصنيف يجعل البيانات منظمة ومبسطة وسهلة الفهم.'),
m('تصنيف السكان حسب المدن هو تصنيف حسب:','التوزيع الجغرافي والمكاني',['الزمن','طبيعة البيانات','العلاقة بين البيانات'],'التصنيف المكاني يعتمد على الموقع (دولة، مدينة، إقليم).'),
m('أداة الفرز (Sorting) في Excel تستخدم من أجل:','ترتيب البيانات تصاعديًا أو تنازليًا',['عرض البيانات التي تحقق شرطًا فقط','جمع القيم','تلوين الخلايا'],'مثل ترتيب أسماء الطلبة أبجديًا أو العلامات من الأعلى للأدنى.'),
m('أداة الفلترة (Filtering) تستخدم من أجل:','عرض البيانات التي تفي بشروط محددة فقط',['ترتيب الأسماء أبجديًا','حذف الأعمدة','رسم المخططات'],'مثل عرض الطلبة الحاصلين على 90% فأعلى.'),
m('الدالة المستخدمة لحساب مجموع نطاق من الخلايا:','SUM',['AVERAGE','MAX','MIN'],'مثال: =SUM(B2:B8).'),
t('الصيغة =AVERAGE(B2:B8) تحسب أعلى قيمة في النطاق.',0,'خطأ؛ تحسب المتوسط، أما أعلى قيمة فتحسبها MAX.'),
m('تستخدم أداة التنسيق الشرطي من أجل:','تلوين الخلايا تلقائيًا حسب قيمها وفق قواعد',['حذف القيم المكررة','ترتيب البيانات','جمع القيم'],'تسلط الضوء على البيانات المهمة وتسهل تحليلها.'),
m('تجميع المبيعات اليومية في إجماليات شهرية مثال على التجميع:','حسب الزمن',['حسب الفئات','الحسابي','لا يعد تجميعًا'],'التجميع حسب الزمن يعتمد على وحدات زمنية (يوم، شهر، سنة).')]},

{n:'الدرس الثالث: التمثيل المرئي للبيانات',q:[
m('التمثيل المرئي للبيانات هو:','عرض البيانات بصريًا لتسهيل فهمها وتحليلها',['تخزين البيانات بالنظام الثنائي','حذف البيانات غير المهمة','تشفير البيانات'],'يبرز العلاقات والأنماط بين البيانات.'),
m('الخاصية التي تشير إلى الكمية الكبيرة جدًا من البيانات هي:','الحجم (Volume)',['السرعة (Velocity)','التنوع (Variety)','القيمة (Value)'],'من خصائص البيانات الضخمة: الحجم والسرعة والتنوع والصحة والقيمة.'),
m('خاصية السرعة (Velocity) في البيانات الضخمة تعني:','سرعة إنشاء البيانات وتحليلها في الوقت الحقيقي',['تنوع أشكال البيانات','دقة البيانات','كمية البيانات'],'البيانات تتولد وتتزايد بسرعة كبيرة.'),
m('خاصية التنوع (Variety) تعني:','تعدد أشكال البيانات كالنصوص والصور والفيديو',['كبر حجم البيانات','سرعة معالجتها','صحتها وموثوقيتها'],'تشمل البيانات المهيكلة وغير المهيكلة.'),
m('عملية تغيير شكل البيانات أو صيغتها دون التأثير في محتواها الأصلي:','التحويل',['التعميم','التبسيط','التمثيل'],'مثل تحويل التواريخ إلى تنسيق موحد.'),
m('تصنيف أعمار الأشخاص في مجموعات (10–20، 20–30...) مثال على:','التعميم',['التحويل','التمثيل','التنظيف'],'التعميم يقلل التفاصيل ويركز على الأنماط العامة.'),
m('لعرض النسب المئوية للأجزاء من الكل نستخدم:','المخطط الدائري',['الرسم الخطي','مخطط الانتشار','الرسم الشريطي'],'كل قطاع يمثل جزءًا من الكل.'),
m('لمقارنة كميات أو قيم بين مجموعات مختلفة يناسب:','الرسم الشريطي',['الرسم الدائري','الخريطة الجغرافية','مخطط جانت'],'ارتفاع الشريط أو طوله يعبر عن القيمة.'),
m('لإظهار تغير درجات الحرارة خلال أيام الأسبوع نستخدم:','الرسم الخطي',['الرسم الدائري','الخريطة الجغرافية','مخطط جانت'],'الرسم الخطي مناسب للبيانات المرتبطة بالزمن.'),
m('لإظهار العلاقة بين متغيرين مثل الطول والوزن نستخدم:','مخطط الانتشار (Scatter Plot)',['الرسم الدائري','الخريطة الجغرافية','مخطط جانت'],'يكشف نوع العلاقة وقوتها والقيم الشاذة.'),
t('العلاقة الطردية (الإيجابية) تعني أنه كلما زاد أحد المتغيرين زاد الآخر.',1,'صحيح؛ مثل ارتفاع الحرارة وزيادة مبيعات المشروبات الباردة.'),
t('القيم الشاذة (Outliers) قيم تختلف بشكل كبير عن بقية البيانات.',1,'صحيح؛ ويكشفها مخطط الانتشار بسهولة.'),

/* ===== المنطق ===== */
const $=id=>document.getElementById(id);
const sel=$('ls');
L.forEach((l,i)=>sel.add(new Option(l.n+' (20 سؤالًا)',i)));
sel.add(new Option('الاختبار الشامل (20 سؤالًا من جميع الدروس)','all'));

let exam=[],student='',lesson='',done=false,rep='';

function prep(x){
  if(typeof x==='function')x=x();
  if(x.tf)return {...x};
  const right=x.o[x.a];const o=shuf(x.o);
  return {...x,o,a:o.indexOf(right)};
}
function start(){
  student=$('nm').value.trim();
  if(student.split(/\s+/).length<2){alert('يرجى كتابة الاسم (الاسم الأول واسم العائلة على الأقل).');$('nm').focus();return}
  const v=sel.value;
  const pool=v==='all'?L.flatMap(l=>l.q):L[v].q;
  lesson=v==='all'?'الاختبار الشامل':L[v].n;
  exam=shuf(pool).slice(0,20).map(prep);
  let h='';
  exam.forEach((q,i)=>{
    h+=`<div class="q"><b>${i+1}. ${q.q}</b>`;
    q.o.forEach((o,j)=>h+=`<label class="op"><input type="radio" name="q${i}" value="${j}" onchange="cnt()"><span><bdi>${o}</bdi></span></label>`);
    h+='</div>';
  });
  $('qs').innerHTML=h;
  $('s1').classList.add('hide');$('s2').classList.remove('hide');
  cnt();window.scrollTo(0,0);
}
function cnt(){
  const n=exam.filter((_,i)=>document.querySelector(`input[name=q${i}]:checked`)).length;
  $('bar').textContent=`${lesson} — تمت الإجابة عن ${n} من ${exam.length}`;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function finish(){
  const un=exam.filter((_,i)=>!document.querySelector(`input[name=q${i}]:checked`)).length;
  if(un&&!confirm(`لم تجيبي عن ${un} سؤال/أسئلة. هل تريدين الإنهاء والتصحيح؟`))return;
  let s=0,h='',rows='';
  exam.forEach((q,i)=>{
    const c=document.querySelector(`input[name=q${i}]:checked`);
    const ans=c?+c.value:-1,ok=ans===q.a;if(ok)s++;
    const yours=ans<0?'لم تتم الإجابة':q.o[ans];
    h+=`<div class="r ${ok?'ok':'no'}"><b>${i+1}. ${q.q}</b><small>${ok?'✅ إجابة صحيحة، أحسنتِ.':'❌ إجابتكِ: <bdi>'+yours+'</bdi> — الإجابة الصحيحة: <bdi>'+q.o[q.a]+'</bdi>'}</small><small>💡 ${q.e}</small></div>`;
    rows+=`<tr style="background:${ok?'#dcfce7':'#fee2e2'}"><td>${i+1}</td><td>${q.q}</td><td><bdi>${yours}</bdi></td><td><bdi>${q.o[q.a]}</bdi></td><td>${q.e}</td></tr>`;
  });
  const p=Math.round(s/exam.length*100);
  const msg=p>=90?'ممتاز! أتقنتِ هذا الدرس، واصلي تميّزكِ 🌟':p>=75?'جيد جدًا! راجعي الأسئلة الخاطئة لتصلي إلى الإتقان 👏':p>=60?'جيد. تحتاجين إلى مراجعة بعض مفاهيم الدرس 📘':'تحتاجين إلى مراجعة الدرس من الكتاب ثم إعادة المحاولة 💪';
  $('sc').textContent=`${s} / ${exam.length}  (${p}%)`;
  $('mg').textContent=msg;$('rv').innerHTML=h;
  $('s2').classList.add('hide');$('s3').classList.remove('hide');
  const d=new Date().toLocaleString('ar-JO');
  rep=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>نتيجة ${esc(student)}</title><style>body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;max-width:900px;margin:20px auto;padding:0 12px}h2,h3{text-align:center;margin:4px}table{border-collapse:collapse;width:100%;margin-top:14px}td,th{border:1px solid #ccc;padding:6px;font-size:14px}th{background:#047857;color:#fff}</style></head><body><h2>مدرسة سوم الثانوية الشاملة للبنات</h2><h3>مادة المهارات الرقمية — الوحدة الأولى: تحليل البيانات</h3><hr><p><b>اسم الطالبة:</b> ${esc(student)}<br><b>الاختبار:</b> ${esc(lesson)}<br><b>التاريخ:</b> ${d}<br><b>النتيجة:</b> ${s} / ${exam.length} (${p}%) — ${msg}</p><table><tr><th>#</th><th>السؤال</th><th>إجابتها</th><th>الإجابة الصحيحة</th><th>التغذية الراجعة</th></tr>${rows}</table><p style="text-align:center">إعداد المعلمة: ${TEACHER}</p></body></html>`;
  window.scrollTo(0,0);
  save();
  send({date:d,name:student,lesson:lesson,score:s,total:exam.length,percent:p});
}
function pend(){try{return JSON.parse(localStorage.getItem('pendingResults')||'[]')}catch(e){return[]}}
function setPend(a){try{localStorage.setItem('pendingResults',JSON.stringify(a))}catch(e){}}
async function send(rec){
  const sd=$('sd');
  if(!SHEET_URL){return}
  const q=pend();if(rec)q.push(rec);
  setPend(q);
  if(!q.length)return;
  sd.textContent='جارٍ إرسال النتيجة إلى المعلمة...';
  const left=[];
  for(const r of q){
    try{await fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(r)})}
    catch(e){left.push(r)}
  }
  setPend(left);
  sd.textContent=left.length?'⚠ تعذر الإرسال (لا يوجد اتصال بالإنترنت). النتيجة محفوظة على الجهاز، افتحي الملف لاحقًا مع الإنترنت وسيُعاد الإرسال تلقائيًا.':'✔ تم إرسال النتيجة إلى المعلمة.';
}
window.addEventListener('load',()=>{if(SHEET_URL&&pend().length)send(null)});
async function save(){
  const name=`نتيجة_${student.replace(/\s+/g,'_')}_${lesson.split(':')[0].replace(/\s+/g,'_')}.html`;
  const st=$('st');
  try{
    if(window.showSaveFilePicker){
      const f=await showSaveFilePicker({suggestedName:name,startIn:'desktop',types:[{description:'تقرير النتيجة',accept:{'text/html':['.html']}}]});
      const w=await f.createWritable();await w.write(new Blob(['\ufeff',rep],{type:'text/html'}));await w.close();
      st.textContent='✔ تم حفظ النتيجة في المكان الذي اخترتِه (يفضّل سطح المكتب).';
    }else throw new Error('x');
  }catch(e){
    if(e&&e.name==='AbortError'){st.textContent='لم يتم الحفظ. اضغطي «حفظ النتيجة على سطح المكتب» للمحاولة مرة أخرى.';return}
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\ufeff',rep],{type:'text/html'}));a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    st.textContent='✔ تم تنزيل ملف النتيجة إلى مجلد التنزيلات (Downloads)، انقليه إلى سطح المكتب.';
  }
}
</script>
</body>
</html>
